# ═══════════════════════════════════════════════════════════════════════════
# SONARQUBE CONFIGURATION - BACKEND
# ═══════════════════════════════════════════════════════════════════════════

# Project Information
sonar.projectKey=backend
sonar.projectName=Backend API - PI DEV
sonar.projectVersion=1.0

# Source Code
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclude files from analysis (align with Jest configuration)
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.module.ts,**/main.ts,**/*.dto.ts,**/*.entity.ts,**/*.enum.ts,**/*.interface.ts,**/*.decorator.ts,**/*.guard.ts,**/*.strategy.ts,**/*.filter.ts,**/*.interceptor.ts,**/*.middleware.ts,**/*.pipe.ts,**/*.config.ts,**/*.constants.ts,**/*.types.ts,**/migrations/**,**/scripts/**,**/database/**,**/config/**

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.module.ts,**/main.ts,**/*.dto.ts,**/*.entity.ts,**/*.enum.ts,**/*.spec.ts,**/*.test.ts

# Code Quality
sonar.typescript.node=node

# Duplications
sonar.cpd.exclusions=**/*.dto.ts,**/*.entity.ts,**/*.enum.ts

# Quality Gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Coverage Thresholds (realistic for this project)
sonar.coverage.minimum=35.0

# Exclude files from coverage calculation (align with Jest)
sonar.coverage.exclusions=**/*.module.ts,**/main.ts,**/*.dto.ts,**/*.entity.ts,**/*.enum.ts,**/*.interface.ts,**/*.decorator.ts,**/*.guard.ts,**/*.strategy.ts,**/*.filter.ts,**/*.interceptor.ts,**/*.middleware.ts,**/*.pipe.ts,**/*.config.ts,**/*.constants.ts,**/migrations/**,**/scripts/**,**/database/**,**/config/**,**/auth/**,**/email/**,**/payments/**,**/platform-admin/**,**/platform-auth/**,**/Purchases/**,**/sales/**,**/statistics/**,**/support/**,**/app.controller.ts,**/app.service.ts