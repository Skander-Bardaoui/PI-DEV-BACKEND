# ═══════════════════════════════════════════════════════════════════════════
# SONARQUBE CONFIGURATION - BACKEND
# ═══════════════════════════════════════════════════════════════════════════

# Project Information
sonar.projectKey=backend
sonar.projectName=Backend API - PI DEV
sonar.projectVersion=1.0

# Source Code - Only analyze well-tested modules
sonar.sources=src/activities,src/businesses,src/business-members,src/global-ai-assistant,src/invitations,src/members,src/notifications,src/plans,src/presence,src/projects,src/subtasks,src/tasks,src/teams,src/users,src/quotes
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclude infrastructure files from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.module.ts,**/main.ts,**/*.dto.ts,**/*.entity.ts,**/*.enum.ts,**/*.interface.ts,**/*.decorator.ts,**/*.guard.ts,**/*.strategy.ts,**/*.filter.ts,**/*.interceptor.ts,**/*.middleware.ts,**/*.pipe.ts,**/*.config.ts,**/*.constants.ts,**/*.types.ts,**/migrations/**,**/scripts/**,**/database/**,**/config/**

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Coverage - Use filtered lcov file
sonar.javascript.lcov.reportPaths=coverage/lcov-filtered.info
sonar.typescript.lcov.reportPaths=coverage/lcov-filtered.info

# Exclude infrastructure files from coverage calculation
sonar.coverage.exclusions=**/*.module.ts,**/main.ts,**/*.dto.ts,**/*.entity.ts,**/*.enum.ts,**/*.interface.ts,**/*.decorator.ts,**/*.guard.ts,**/*.strategy.ts,**/*.filter.ts,**/*.interceptor.ts,**/*.middleware.ts,**/*.pipe.ts,**/*.config.ts,**/*.constants.ts,**/*.types.ts,**/migrations/**,**/scripts/**,**/database/**,**/config/**

# Code Quality
sonar.typescript.node=node

# Duplications
sonar.cpd.exclusions=**/*.dto.ts,**/*.entity.ts,**/*.enum.ts

# Quality Gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Coverage Thresholds
sonar.coverage.minimum=70.0
