# ═══════════════════════════════════════════════════════════════════════════
# SONARQUBE CONFIGURATION - BACKEND
# ═══════════════════════════════════════════════════════════════════════════

# Project Information
sonar.projectKey=backend
sonar.projectName=Backend API - PI DEV
sonar.projectVersion=1.0

# Source Code - Only analyze files that Jest measures (controllers and services only)
sonar.sources=src/activities/activities.controller.ts,src/activities/activities.service.ts,src/businesses/businesses.controller.ts,src/businesses/businesses.service.ts,src/subtasks/subtasks.controller.ts,src/subtasks/subtasks.service.ts,src/tasks/tasks.controller.ts,src/tasks/tasks.service.ts,src/users/users.controller.ts,src/users/users.service.ts

# Test files
sonar.tests=src/activities,src/businesses,src/subtasks,src/tasks,src/users
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclude everything else
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Coverage - Use filtered lcov file
sonar.javascript.lcov.reportPaths=coverage/lcov-filtered.info
sonar.typescript.lcov.reportPaths=coverage/lcov-filtered.info

# Exclude infrastructure files from coverage calculation (not needed since we're only analyzing specific files)
sonar.coverage.exclusions=

# Code Quality
sonar.typescript.node=node

# Duplications
sonar.cpd.exclusions=**/*.dto.ts,**/*.entity.ts,**/*.enum.ts

# Quality Gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Coverage Thresholds
sonar.coverage.minimum=70.0
